[project]
name = "well-less-backend"
version = "0.1.0"
description = "well less AAC skincare routine analysis API"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.116,<1.0",
    "httpx>=0.28,<1.0",
    "openai>=1.100,<3.0",
    "pydantic-settings>=2.10,<3.0",
    "python-dotenv>=1.2.3",
    "python-multipart>=0.0.20,<1.0",
    "supabase>=2.18,<3.0",
    "uvicorn[standard]>=0.35,<1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.4,<9.0",
    "pytest-asyncio>=1.1,<2.0",
    "ruff>=0.12,<1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

